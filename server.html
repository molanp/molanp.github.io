<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MC服务器状态 | molanp</title>
    <meta
      name="description"
      content="查看 molanp 的 Minecraft 基岩版服务器实时状态"
    />
    <meta
      name="keywords"
      content="Minecraft服务器, 基岩版, molanp, AwkChan, MC状态查询, 游戏服务监控"
    />
    <meta name="author" content="molanp" />
    <meta name="language" content="zh-CN" />
    <link rel="canonical" href="https://awkchan.top/server.html" />
    <link
      href="//fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tailwindcss.css" />
    <style>
      .hidden {
        display: none;
      }
      .bubble {
        background-color: #e0f7fa;
        border-radius: 20px;
        padding: 1rem;
        margin: 0.5rem 0;
        position: relative;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }
      .bubble::after {
        content: "";
        position: absolute;
        top: 0;
        width: 0;
        height: 0;
        border: 1rem solid transparent;
        border-bottom-color: #e0f7fa;
        border-top: 0;
        left: -1rem;
      }
      .bubble-content {
        padding-left: 1rem;
      }
      .bubble-author {
        font-size: 0.875rem;
        color: #555;
        text-align: right;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body
    class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-[Quicksand] transition-all"
  >
    <h1 class="text-3xl font-bold mb-6 text-center">
      Minecraft 基岩版服务器状态
    </h1>
    <!-- 顶部导航栏 -->
    <nav class="w-full bg-white dark:bg-gray-900 shadow-sm fixed top-0 z-40">
      <div
        class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center text-mint font-semibold"
      >
        <div class="flex gap-6">
          <a href="/" class="hover:underline">主页</a>
          <a href="#" class="hover:underline">MC服务器</a>
        </div>
      </div>
    </nav>
    <br />

    <!-- 内容区 -->
    <main class="max-w-3xl mx-auto px-4 py-24 text-center">
      <!-- 状态展示区 -->
      <div class="bubble">
        <div class="bubble-content">
          <p class="mb-2">
            <strong>MOTD：</strong><span id="motd">{{ motd }}</span>
          </p>
          <p class="mb-2">
            <strong>在线人数：</strong
            ><span id="players">{{ online }}/{{ max }} 人</span>
          </p>
          <p class="mb-2">
            <strong>地图：</strong><span id="map">{{ map }}</span>
          </p>
          <p class="mb-2">
            <strong>版本：</strong><span id="version">{{ version }}</span>
          </p>
          <p class="mb-2">
            <strong>状态：</strong><span id="status">{{ status }}</span>
          </p>
        </div>
      </div>

      <!-- 异常提示 -->
      <div id="error" class="mt-4 text-sm text-red-500 hidden bubble">
        <div class="bubble-content">
          无法获取服务器状态，请稍后重试(<span id="errText"></span>)
        </div>
      </div>

      <p class="mt-4 text-sm text-gray-500">
        服务器状态数据由
        <a
          href="https://api.imlazy.ink/#/mcapi"
          target="_blank"
          rel="nofollow noopener"
          class="underline"
          >雫 API</a
        >
        提供 · 实时刷新
      </p>
    </main>

    <!-- 页脚 -->
    <footer class="text-center py-6 text-sm text-gray-500 dark:text-gray-400">
      <p>
        <a
          href="//icp.gov.moe/?keyword=20250395"
          target="_blank"
          rel="noopener"
          class="underline"
          >萌ICP备 20250395号</a
        >
        <a
          href="//icp.redcha.cn/beian/ICP-2025100183.html"
          target="_blank"
          rel="noopener"
          class="underline"
          >茶ICP备 2025100183号</a
        >
      </p>
      <p class="mt-1">© 2025 molanp & AwkChan</p>
    </footer>

    <!-- 动态刷新逻辑 -->
    <script>
      async function fetchServerStatus() {
        const errorEl = document.getElementById("error");
        const errTextEl = document.getElementById("errText");

        try {
          let response;
          response = await fetch(
            "https://api.imlazy.ink/mcapi/?host=mc.awkchan.top:15300&type=json&be=true"
          );

          if (!response.ok) {
            const text = await response.text().catch(() => "");
            throw new Error(
              `HTTP ${response.status} ${response.statusText}${
                text ? " - " + text : ""
              }`
            );
          }

          const data = await response.json();

          document.getElementById("motd").textContent = data.motd;
          document.getElementById("status").textContent = data.status;
          document.getElementById(
            "players"
          ).textContent = `${data.players_online} / ${data.players_max} 人`;
          document.getElementById("version").textContent = data.version;
          document.getElementById("map").textContent = data.map;

          errorEl.classList.add("hidden");
          errTextEl.textContent = "";
        } catch (error) {
          console.error("获取服务器状态失败：", error);
          errorEl.classList.remove("hidden");
          errTextEl.textContent =
            error && error.message ? error.message : String(error);
        }
      }
      fetchServerStatus();
      setInterval(fetchServerStatus, 15000);
    </script>
  </body>
</html>
