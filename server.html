<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MC服务器状态 | molanp</title>
  <meta name="description" content="查看 molanp 的 Minecraft 基岩版服务器实时状态，包括 MOTD、延迟、在线人数与版本信息，由 AwkChan 提供数据支持。" />
  <meta name="keywords" content="Minecraft服务器, 基岩版, molanp, AwkChan, MC状态查询, 游戏服务监控" />
  <meta name="author" content="molanp" />
  <meta name="language" content="zh-CN" />
  <link rel="canonical" href="https://awkchan.top/server.html" />
  <link href="//fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tailwindcss.css" />
  <style>
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-[Quicksand] transition-all">

  <!-- 顶部导航栏 -->
  <nav class="w-full bg-white dark:bg-gray-900 shadow-sm fixed top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center text-mint font-semibold">
      <div class="flex gap-6">
        <a href="/" class="hover:underline">主页</a>
        <a href="#" class="hover:underline">MC服务器</a>
      </div>
    </div>
  </nav>
  <br/>

  <!-- 内容区 -->
  <main class="max-w-3xl mx-auto px-4 py-24 text-center">
    <h1 class="text-3xl font-bold mb-6">Minecraft 基岩版服务器状态</h1>

    <!-- 状态展示区 -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 mb-8 text-left">
      <p class="mb-2"><strong>MOTD：</strong> <span id="motd">{{ motd }}</span></p>
      <p class="mb-2"><strong>在线人数：</strong> <span id="players">{{ online }}/{{ max }}</span></p>
      <p class="mb-2"><strong>地图：</strong> <span id="map">{{ map }}</span></p>
      <p class="mb-2"><strong>版本：</strong> <span id="version">{{ version }}</span></p>
      <p class="mb-2"><strong>状态：</strong> <span id="status">{{ status }}</span></p>
    </div>

    <!-- 异常提示 -->
    <div id="error" class="mt-4 text-sm text-red-500 hidden">无法获取服务器状态，请稍后重试。</div>

    <p class="mt-4 text-sm text-gray-500">服务器状态数据由 <a href="https://api.imlazy.ink/#/mcapi" target="_blank" rel="nofollow noopener">雫 API</a> 提供 · 实时刷新</p>
  </main>

  <!-- 页脚 -->
  <footer class="text-center py-6 text-sm text-gray-500 dark:text-gray-400">
    <p>
      <a href="//icp.gov.moe/?keyword=20250395" target="_blank" rel="noopener" class="underline">萌ICP备 20250395号</a>
      <a href="//icp.redcha.cn/beian/ICP-2025100183.html" target="_blank" rel="noopener" class="underline">茶ICP备2025100183号</a> 
    </p>
    <p class="mt-1">© 2025 molanp & AwkChan</p>
  </footer>

  <!-- 动态刷新逻辑 -->
  <script>
    async function fetchServerStatus() {
      const errorEl = document.getElementById('error');

      try {
        const response = await fetch('https://api.imlazy.ink/mcapi/?host=mc.awkchan.top:16000&type=json&be=true');
        if (!response.ok) throw new Error('响应异常');

        const data = await response.json();

        document.getElementById('motd').textContent = data.motd;
        document.getElementById('status').textContent = data.status;
        document.getElementById('players').textContent = `${data.players_online} / ${data.players_max} 人`;
        document.getElementById('version').textContent = data.version;
        document.getElementById('map').textContent = data.map;

        errorEl.classList.add('hidden');
      } catch (error) {
        console.error('获取服务器状态失败：', error);
        errorEl.classList.remove('hidden');
      }
    }

    fetchServerStatus();
    setInterval(fetchServerStatus, 10000);
  </script>

</body>
</html>
